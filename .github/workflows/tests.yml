name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # uv's managed Python builds support loadable SQLite extensions (needed by sqlite-vec)
      - name: Install uv
        run: python -m pip install uv
      - name: Create venv and install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e ".[test]"
      - name: Unit tests (no network, no model)
        run: .venv/bin/python -m pytest -q
