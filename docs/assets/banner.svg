      <path d="M-46 -30 L0 -56 L46 -30 L46 30 L0 56 L-46 30 Z"/>
      <path d="M0 -56 L0 0 M-46 30 L0 0 L46 30"/>
    </g>
    <g fill="#ffffff">
      <circle cx="0" cy="-56" r="9"/>
      <circle cx="46" cy="-30" r="9"/>
      <circle cx="46" cy="30" r="9"/>
      <circle cx="0" cy="56" r="9"/>
      <circle cx="-46" cy="30" r="9"/>
      <circle cx="-46" cy="-30" r="9"/>
    </g>
    <circle cx="0" cy="0" r="15" fill="#5eead4"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="228" y="112" font-size="60" font-weight="700" letter-spacing="-1">agent-memory</text>
    <text x="230" y="154" font-size="23" fill="#e0e7ff">Long-term memory for AI agents · MCP server · local and private</text>
    <text x="230" y="190" font-size="17" fill="#99f6e4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">search · day · session · note · facts</text>
  </g>
