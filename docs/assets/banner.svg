<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="agent-memory: long-term memory for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <clipPath id="card"><rect width="960" height="240" rx="24"/></clipPath>
  </defs>
  <rect width="960" height="240" rx="24" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#ffffff" stroke-width="1" clip-path="url(#card)">
    <path d="M0 60 H960 M0 120 H960 M0 180 H960"/>
    <path d="M120 0 V240 M240 0 V240 M360 0 V240 M480 0 V240 M600 0 V240 M720 0 V240 M840 0 V240"/>
  </g>
  <!-- memory graph mark -->
  <g transform="translate(120 120)">
