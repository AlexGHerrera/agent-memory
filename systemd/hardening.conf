# Drop-in added by install.sh (user and system mode; skip with --no-hardening) to the server and ingestion units.
# In user mode systemd enables PrivateUsers= implicitly for these options: the kernel must allow unprivileged user
# namespaces. If the unit fails with status 226/NAMESPACE, reinstall with --no-hardening.
[Service]
PrivateTmp=true
ProtectSystem=strict
# Reads transcripts under /home (e.g. ~/.claude/projects); writes only to the base dir
ProtectHome=read-only
ReadWritePaths=@BASE@
# Keep library caches inside the base dir (the rest of the file system is read-only)
Environment=XDG_CACHE_HOME=@BASE@/work/cache
Environment=HF_HOME=@BASE@/models/hf-home
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
