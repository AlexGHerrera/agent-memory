# Drop-in added by install.sh (user and system mode; skip with --no-hardening) to the consolidation unit.
# It runs the LLM CLI (default `claude -p`), which needs its own state writable: ~/.claude, ~/.claude.json and
# caches. Everything else is read-only. If your llm_command writes elsewhere, add a ReadWritePaths= line in an
# override (`systemctl [--user] edit agent-memory-consolidate.service`).
[Service]
PrivateTmp=true
ProtectSystem=strict
ReadWritePaths=@BASE@
ReadWritePaths=-@HOME@/.claude -@HOME@/.claude.json -@HOME@/.claude.json.backup
ReadWritePaths=-@HOME@/.cache -@HOME@/.local/state -@HOME@/.local/share/claude
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
